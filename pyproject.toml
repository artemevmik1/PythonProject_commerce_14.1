[project]
name = "pythonproject-commerce-14-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Arteemyev Mikhail",email = "artemevmik1@rambler.ru"}
]
requires-python = "^3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]


[tool.black]
line-length = 119
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/*"]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true


[tool.poetry.scripts]
lint = "flake8 ."
format = "black ."
sort-imports = "isort ."
check-all = "flake8 . && mypy . && black --check ."

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "F401"]
exclude = [".venv", "venv", "__pycache__", "build", "dist", "migrations"]
per-file-ignores = ["__init__.py:F401"]
docstring-convention = "google"



[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/main.py",         # Можно исключить и другие
    "*/venv/*",
    "*/.venv/*",
]